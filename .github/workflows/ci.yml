name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install isales-common (v0.1.2)
        run: pip install "isales-common @ git+https://internal/isales-common.git@v0.1.2"
        continue-on-error: true

      - name: Install package + dev deps
        run: pip install -e '.[dev]'

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy isales_worker

      - name: Pytest
        run: pytest -q
